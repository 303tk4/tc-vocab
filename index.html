<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="繁体中文（台湾華語）の単語学習アプリ" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#b4232f" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>學中文 | tc-vocab</title>
    <script>
      // React の描画前にテーマ・表示サイズ・アクセントカラー・言語を適用して、ちらつきを防ぐ。
      // src/settings/boot.ts と対応（キー名・値を変えるときは両方を直す）
      ;(function () {
        var s = {}
        try {
          s = JSON.parse(localStorage.getItem('tc-vocab:boot') || '{}') || {}
        } catch (e) {}
        var root = document.documentElement
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var theme = s.theme === 'light' || s.theme === 'dark' ? s.theme : dark ? 'dark' : 'light'
        root.dataset.theme = theme
        root.dataset.fontScale = /^(sm|md|lg|xl)$/.test(s.fontScale) ? s.fontScale : 'md'
        var accent = /^(red|green|blue|purple|orange|mono)$/.test(s.accent) ? s.accent : 'red'
        root.dataset.accent = accent
        // ウィンドウ上部の色（FR-SET-04）。src/settings/accents.ts の themeColorFor と同じ値
        var themeColors = {
          red: '#b4232f',
          green: '#1d6b40',
          blue: '#1f5fbf',
          purple: '#6a3fb5',
          orange: '#b04a0c',
          mono: '#1f1d1a',
        }
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', themeColors[accent])
        if (/^(ja|zh-TW|en)$/.test(s.uiLanguage)) root.lang = s.uiLanguage
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
