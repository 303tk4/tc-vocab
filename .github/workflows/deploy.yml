# main への push でチェック → GitHub Pages へデプロイ（仕様書 12.2）
# PR ではチェックだけを行う
name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build # tsc -b（型チェック）を含む
      - run: npm run size # 初回表示の JS の大きさ（NFR-02）
      # E2E テスト（仕様書 13.1）。CI では Chromium だけで動かす
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - run: npx playwright test --project=perf # 1万語での性能（NFR-01）。ほかのテストと同時に動かさない
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
